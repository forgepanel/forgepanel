name: App Center host hint probe (unprivileged, standalone)

on:
  pull_request:
    branches: [develop, stable, main, production]
    paths:
      - 'tools/app-center-host-probe/**'
      - '.github/workflows/app-center-host-probe.yml'
  push:
    branches: [develop, stable, main, production]
    paths:
      - 'tools/app-center-host-probe/**'
      - '.github/workflows/app-center-host-probe.yml'

permissions:
  contents: read

concurrency:
  group: app-host-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-hints:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/app-center-host-probe
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect compiler
        run: go version
      - name: Enforce Go formatting
        run: |
          changes=$(gofmt -l .)
          if [ -n "$changes" ]; then echo "$changes"; exit 1; fi
      - name: Run isolated standard-library unit tests and race checks
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Confirm actual OS hints never grant qualification or install
        run: |
          set -o pipefail
          go run ./cmd/forgepanel-app-center-observe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]==1; assert d["probe_name"]=="forgepanel-app-center-host-observe"; assert d["driver_qualification"]=="NOT_EXECUTED"; assert d["qualified_container_drivers"]==[]; assert d["visible_cgroup_root"]["observation_scope"]=="VISIBLE_MOUNT_ROOT_ONLY_UNVERIFIED"; assert all(d[k] is False for k in ("host_identity_verified","actor_authorization_verified","host_capacity_budget_verified","cgroup_limits_enforced","container_runtime_tested","report_signed","linux_execution_authorized","install_apply_available")); print("PASS: OS hints never imply trusted capacity, driver qualification or privileged execution")'
      - name: Reject arguments and any requested action
        run: |
          set +e
          result=$(go run ./cmd/forgepanel-app-center-observe apply 2>&1)
          exit_code=$?
          set -e
          [ "$exit_code" -ne 0 ]
          printf '%s' "$result" | grep -q 'usage: forgepanel-app-center-observe (no arguments)'
