security:
    # The preview login is explicitly read-only. Every /admin visit checks the
    # server-side SQL identity, credential fingerprint and session expiry.
    # A future permanent Symfony authenticator must supersede this candidate
    # before production-facing admin/API resource permissions are enabled.
    firewalls:
        setup:
            pattern: ^/setup
            lazy: true
        panel_readonly:
            pattern: ^/(login|logout|admin)(/|$)
            lazy: true
        default_deny:
            pattern: ^/
            lazy: true
    access_control:
        - { path: ^/setup, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(admin|logout)(/|$), roles: PUBLIC_ACCESS } # Strict controller-side auth, no write actions
        - { path: ^/, roles: ROLE_SUPER_ADMIN } # Without a full authenticator, future routes fail closed
