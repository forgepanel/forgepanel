name: Documentation

on:
  pull_request:
    branches: [develop, stable, main, production]
  push:
    branches: [develop, stable, main, production]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the documentation checker
        run: python3 tests/documentation/test_checker.py -v
      - name: Check Q151-Q160 owner decisions and MVP test matrix
        run: python3 tests/documentation/test_q151_q160.py -v
      - name: Validate Q161-Q170 owner decisions and test matrix
        run: python3 tests/documentation/test_q161_q170.py -v
      - name: Validate documentation readiness and traceability register
        run: python3 tests/documentation/test_readiness_traceability.py -v
      - name: Validate R2 candidate contracts and planned integration test IDs
        run: python3 tests/documentation/test_r2_contracts.py -v
      - name: Check candidate R3 typed IPC registry, schemas and installer gates
        run: python3 tests/documentation/test_r3_ipc_installer.py -v
      - name: Validate R3 durable jobs and peer identity candidate contracts
        run: python3 tests/documentation/test_r3_durable_jobs_peer.py -v
      - name: Validate R3 candidate physical DB, Linux identities and execution guards
        run: python3 tests/documentation/test_r3_physical_boundaries.py -v
      - name: Check R3 job admission, restore fencing, inbox and tenant scope audit
        run: python3 tests/documentation/test_r3_job_integrity_review.py -v
      - name: Test source intake and private staging with synthetic fixtures
        run: python3 -m unittest discover -s tests/source_intake -p 'test_*.py' -v
      - name: Validate App Center free native versus container separation contracts
        run: python3 tests/documentation/test_app_center_separation.py -v
      - name: Validate documentation
        run: python3 scripts/check_documentation.py
      - name: Package the documentation snapshot
        run: |
          mkdir -p /tmp/forgepanel-documentation-output
          git archive --format=zip --output=/tmp/forgepanel-documentation-output/forgepanel-documentation.zip HEAD
      - name: Retain documentation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgepanel-documentation
          path: /tmp/forgepanel-documentation-output/forgepanel-documentation.zip
          if-no-files-found: error
          retention-days: 7
