framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    session:
        handler_id: null
        name: '__Host-FORGE_ADMIN'
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: strict
        cookie_path: /
        cookie_lifetime: 0
        gc_maxlifetime: 1800
    php_errors:
        log: true
    rate_limiter:
        setup_ip:
            policy: sliding_window
            limit: 10
            interval: '5 minutes'
        admin_login_ip:
            policy: sliding_window
            limit: 10
            interval: '5 minutes'
        admin_login_identity:
            policy: sliding_window
            limit: 6
            interval: '5 minutes'
