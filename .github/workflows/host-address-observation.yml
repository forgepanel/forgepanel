name: Host address observation (nonprivileged preflight)

on:
  pull_request:
    branches: [develop, stable, main, production]
    paths:
      - 'tools/host-address-observation/**'
      - '.github/workflows/host-address-observation.yml'
  push:
    branches: [develop, stable, main, production]
    paths:
      - 'tools/host-address-observation/**'
      - '.github/workflows/host-address-observation.yml'

permissions:
  contents: read

jobs:
  unprivileged-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/host-address-observation
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect Go compiler
        run: go version
      - name: Test standalone Go observer offline
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Assert inventory never certifies DNS TLS or working endpoints
        run: |
          set -o pipefail
          go run ./cmd/forgepanel-host-observe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]==1; assert d["verified_access_urls"] == []; assert d["dns_verification"]=="NOT_EXECUTED"; assert d["tls_verification"]=="NOT_EXECUTED"; assert d["listener_verification"]=="NOT_EXECUTED"; assert d["public_reachability"]=="NOT_EXECUTED"; assert [(p["name"],p["path"],p["https_port"]) for p in d["portals"]]==[("FORGE","/forge",8447),("PANEL","/panel",8446)]; print("PASS: read-only observation, no certified endpoints")'
      - name: Refuse accidental DNS lookups unless operator explicitly opts in
        run: |
          set +e
          output=$(go run ./cmd/forgepanel-dns-observe 2>&1)
          code=$?
          set -e
          [ "$code" -ne 0 ]
          printf '%s' "$output" | grep -q 'usage: forgepanel-dns-observe --observe'
      - name: Refuse untrusted CLI arguments
        run: |
          set +e
          output=$(go run ./cmd/forgepanel-host-observe extra-argument 2>&1)
          code=$?
          set -e
          [ "$code" -ne 0 ]
          printf '%s' "$output" | grep -q 'usage: forgepanel-host-observe (no arguments)'
